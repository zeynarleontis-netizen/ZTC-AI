<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://js.puter.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZTC AI V24 · REDLINE INFINITY</title>
<script defer src="https://js.puter.com/v2/"></script>
<style>
:root{
  --bg:#060607;--bg2:#0b0b0e;--surf:#0f0f13;--surf2:#16161c;--line:#2a1b21;--line2:#3d2630;
  --red:#ff2d4f;--red2:#ff6b82;--red3:#8e1027;--ok:#3ddc97;--warn:#f7b955;--bad:#ff5c6c;
  --text:#f3eff1;--muted:#9a8b92;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;min-height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
@supports (height:100dvh){html,body{height:100dvh}}
@supports (height:100svh){body{min-height:100svh}}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 480px at 88% -8%,rgba(255,45,79,.15),transparent 62%),
    linear-gradient(rgba(255,45,79,.04) 1px,transparent 1px) 0 0/48px 48px,
    linear-gradient(90deg,rgba(255,45,79,.04) 1px,transparent 1px) 0 0/48px 48px}
#app{position:relative;z-index:1;display:flex;height:100%;min-height:0;min-width:0;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:transparent;border:1px solid var(--line2);border-radius:8px;padding:6px 11px;font-size:12px;letter-spacing:.02em;transition:border-color .15s,color .15s,background .15s}
button:hover:not(:disabled){border-color:var(--red);color:#fff;background:rgba(255,45,79,.08)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:linear-gradient(135deg,#ff2d4f,#9b1029);border-color:#ff5c73;color:#fff;font-weight:600;position:relative;overflow:hidden;min-width:88px}
button.primary:hover:not(:disabled){background:linear-gradient(135deg,#ff4a66,#b3142f);color:#fff}
button.primary::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.3),transparent);transform:translateX(-130%);animation:sheen 3.2s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-130%)}60%,100%{transform:translateX(330%)}}
button.danger:hover:not(:disabled){border-color:var(--bad);color:var(--bad);background:rgba(255,92,108,.08)}
input[type=text],input[type=password],input[type=url],select,textarea{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red)}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--line2);border-radius:4px;padding:0 4px;color:var(--muted);margin-left:4px}

/* sidebar */
#side{width:282px;min-width:282px;display:flex;flex-direction:column;background:linear-gradient(180deg,#0e0e12,#08080b);border-right:1px solid var(--line);position:relative}
#side::after{content:"";position:absolute;top:0;bottom:0;right:-1px;width:1px;background:linear-gradient(transparent,var(--red),transparent);opacity:.45}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px;border-bottom:1px solid var(--line)}
.logo{width:36px;height:36px;position:relative;flex:0 0 auto}
.logo svg{width:100%;height:100%;display:block}
.logo .ring{position:absolute;inset:-4px;border-radius:50%;border:1px solid transparent;border-top-color:var(--red);border-right-color:rgba(255,45,79,.3);animation:spin 4.5s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-size:15px;letter-spacing:.22em;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
.sec{padding:12px 14px 6px;display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
.sec button{padding:0 8px;font-size:15px;line-height:20px}
.list{overflow:auto;padding:0 8px}
#chats{flex:1;min-height:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;color:#d9d1d5;font-size:13px}
.item:hover{background:var(--surf2)}
.item.on{background:linear-gradient(90deg,rgba(255,45,79,.22),rgba(255,45,79,.03));box-shadow:inset 2px 0 0 var(--red);color:#fff}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .x{opacity:0;border:0;padding:0 4px;color:var(--muted);font-size:15px;line-height:1;background:none}
.item:hover .x{opacity:1}
.item .x:hover{color:var(--bad);background:none}
.foot{padding:10px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px}
#filter{font-size:12px;padding:6px 9px}

/* main */
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:rgba(9,9,12,.96);position:relative;flex-wrap:wrap}
header::after{content:"";position:absolute;left:0;bottom:-1px;height:1px;width:40%;background:linear-gradient(90deg,transparent,var(--red),transparent);transform:translateX(-100%);animation:scan 3.8s linear infinite;pointer-events:none}
@keyframes scan{to{transform:translateX(260%)}}
.seg{display:flex;border:1px solid var(--line2);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:6px 12px;color:var(--muted);background:transparent}
.seg button.on{background:linear-gradient(180deg,rgba(255,45,79,.3),rgba(255,45,79,.1));color:#fff;box-shadow:inset 0 -2px 0 var(--red)}
.pill{font-family:var(--mono);font-size:11px;padding:4px 10px;border:1px solid var(--line2);border-radius:999px;color:var(--muted);white-space:nowrap;max-width:320px;overflow:hidden;text-overflow:ellipsis}
.pill:empty{display:none}
.pill.run{color:var(--red2);border-color:rgba(255,45,79,.5)}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.4)}
.pill.bad{color:var(--bad);border-color:rgba(255,92,108,.5)}
.pill.run::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:7px;vertical-align:1px;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.2}}
.title{flex:1;min-width:80px;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#messages{flex:1;overflow:auto;padding:22px 20px 12px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.msg{width:fit-content;max-width:900px;min-width:0;padding:12px 15px;border-radius:12px;border:1px solid var(--line);background:var(--surf);position:relative;word-break:break-word;content-visibility:auto;contain-intrinsic-size:auto 140px;contain:layout style;animation:in .26s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;max-width:740px;white-space:pre-wrap;background:linear-gradient(135deg,rgba(255,45,79,.2),rgba(40,10,18,.75));border-color:rgba(255,45,79,.36)}
.msg.assistant{align-self:flex-start;width:100%;max-width:920px}
.msg.error{align-self:flex-start;white-space:pre-wrap;background:#170a0d;border-color:rgba(255,92,108,.45);color:#ffb3bb}
.msg.streaming{border-color:rgba(255,45,79,.5)}
.msg.streaming::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;background:var(--red);border-radius:2px;animation:blink 1s ease-in-out infinite}
.msg .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.msg .acts{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity .15s}
.msg:hover .acts{opacity:1}
.msg .acts button{font-size:10px;padding:2px 8px;border-color:var(--line)}
.tag{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;text-decoration:none}
.tag.v-pass{color:var(--ok);border-color:rgba(61,220,151,.45)}
.tag.v-warn{color:var(--warn);border-color:rgba(247,185,85,.45)}
.tag.v-fail{color:var(--bad);border-color:rgba(255,92,108,.55)}
.body{white-space:pre-wrap}
.md{white-space:normal}
.md p{margin:.5em 0}
.md h3,.md h4,.md h5{margin:.9em 0 .35em;color:#ffc4ce;letter-spacing:.02em}
.md h3{font-size:16px}.md h4{font-size:14.5px}.md h5{font-size:13.5px}
.md ul{margin:.45em 0;padding-left:1.25em}
.md li{margin:.25em 0}
.md li::marker{color:var(--red)}
.md code{font-family:var(--mono);font-size:12px;background:#150a0e;border:1px solid var(--line2);border-radius:4px;padding:1px 5px;color:#ff9aa8}
.md strong{color:#fff}
.md em{color:#ffd4da}
.code{margin:10px 0;border:1px solid var(--line2);border-radius:9px;overflow:hidden;background:#08080a}
.codebar{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 12px;background:#0e0e12;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px}
.codebar .lang{flex:1;color:var(--red2);text-transform:uppercase;letter-spacing:.12em;font-size:10px}
.codebar button{padding:2px 8px;font-size:10px}
.code textarea{display:block;width:100%;border:0;border-radius:0;background:#08080a;padding:10px 12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;resize:vertical;outline:none}
.runout{margin:0;padding:8px 12px;font-family:var(--mono);font-size:11.5px;color:#c9d2d8;background:#050506;border-top:1px solid var(--line);white-space:pre-wrap;max-height:220px;overflow:auto}
.pipe{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.stage{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:8px;padding:4px 9px;color:var(--muted);display:inline-flex;gap:7px;align-items:center;background:#0b0b0f}
.stage i{width:7px;height:7px;border-radius:50%;background:#3a2a30;display:inline-block}
.stage.done{color:#e8e1e5}.stage.done i{background:var(--ok)}
.stage.run{border-color:rgba(255,45,79,.6);color:#fff}.stage.run i{background:var(--red);animation:pulse 1s ease-in-out infinite}
.stage.fail{color:var(--bad)}.stage.fail i{background:var(--bad)}
.stage .vd{color:var(--red2)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
details.trace{margin:0 0 10px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;background:#09090c}
details.trace summary{cursor:pointer;color:var(--muted);font-size:11px;font-family:var(--mono);letter-spacing:.05em}
.tstep{margin:9px 0;font-size:12px}
.tstep .tn{color:#fff;font-weight:600;margin-right:9px}
.tstep .tr{color:var(--muted);font-family:var(--mono);font-size:11px;margin-right:9px}
.tstep .ts{color:var(--red2);font-family:var(--mono);font-size:11px}
.tstep pre{margin:5px 0 0;font-family:var(--mono);font-size:11px;color:#a2abb2;white-space:pre-wrap;max-height:96px;overflow:auto}

.tbl{overflow:auto;margin:8px 0}
/* composer */
#composer{border-top:1px solid var(--line);background:rgba(9,9,12,.97);padding:10px 18px 12px}
.inwrap{border-radius:12px;padding:1px;background:var(--line2)}
.inwrap:focus-within{background:linear-gradient(90deg,var(--red3),var(--red),var(--red3))}
#input{display:block;width:100%;resize:none;border-radius:11px;background:#0a0a0d;border:0;padding:11px 13px;min-height:60px;max-height:200px;outline:none;font-size:14px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.crow select{width:auto;padding:5px 8px;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
.chk input{accent-color:var(--red)}
.sp{flex:1}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.fchip{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-radius:7px;padding:3px 8px;display:inline-flex;gap:6px;align-items:center;background:#0c0c10}
.fchip button{padding:0 4px;border:0;font-size:13px;line-height:1}

/* modals and palette */
#overlay{position:fixed;inset:0;background:rgba(2,2,4,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{width:min(840px,100%);max-height:88vh;overflow:auto;background:#0d0d11;border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.7);padding:18px 20px;animation:in .2s ease-out both}
.modal h3{margin:0 0 14px;font-size:15px;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
.modal h4{margin:18px 0 8px;font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.field{margin-bottom:12px}
.field label{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
td.mono,.mono{font-family:var(--mono)}
#palette{position:fixed;inset:0;background:rgba(2,2,4,.7);z-index:55;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
.pal-box{width:min(560px,94vw);background:#0d0d11;border:1px solid var(--line2);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7);animation:in .18s ease-out both}
#palInput{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#0b0b0e;padding:14px 16px;font-size:14px}
.pal-list{max-height:340px;overflow:auto}
.pal-item{padding:10px 16px;cursor:pointer;font-size:13px}
.pal-item.sel{background:linear-gradient(90deg,rgba(255,45,79,.26),rgba(255,45,79,.03))}
.load-older{align-self:center;margin:2px auto 10px;color:var(--red2);border-style:dashed;background:rgba(255,45,79,.04)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#16090d;border:1px solid var(--red);padding:9px 14px;border-radius:9px;font-size:12px;z-index:60;max-width:90vw;animation:in .2s ease-out both}

#menuBtn{display:none}
@media(max-width:820px){#menuBtn{display:inline-block}#side{position:fixed;left:0;top:0;bottom:0;z-index:40;width:84vw;min-width:0;transform:translateX(-104%);transition:transform .22s ease;box-shadow:12px 0 40px rgba(0,0,0,.6)}#side.open{transform:none}header{padding:8px 10px}#messages{padding:14px 10px}#composer{padding:9px 10px}.msg{max-width:100%}.grid2{grid-template-columns:1fr}}
@media(max-width:1024px){#side{width:250px;min-width:250px}#messages{padding-left:14px;padding-right:14px}}
@media(max-width:820px){#app{height:100%;min-height:0}#side{width:min(84vw,330px)}main{min-width:0}header{gap:6px}header .title{min-width:60px}#messages{min-height:0}.msg{max-width:100%}.msg.assistant{width:100%}#composer{padding-bottom:max(9px,env(safe-area-inset-bottom))}}
@media(max-width:560px){header{padding:7px 8px;gap:5px}header button{padding:6px 8px;font-size:11px}.seg button{padding:6px 8px;font-size:11px}.pill{max-width:45vw;font-size:10px}#messages{padding:10px 8px;gap:10px}.msg{padding:10px 11px;border-radius:10px}.msg .acts{opacity:1;flex-wrap:wrap}.toolbar{gap:5px}.toolbar button{padding:6px 8px;font-size:11px}.dd-btn{min-width:110px;padding:6px 8px;font-size:11px}#input{font-size:16px}.foot{padding:8px;gap:5px}#wm{padding-bottom:max(8px,env(safe-area-inset-bottom))}.modal{padding:14px;max-height:92dvh}.grid2{grid-template-columns:1fr}}
@media(hover:none){.msg .acts{opacity:1}.item .x{opacity:.8}}
.low-power *, .low-power *::before, .low-power *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.low-power body::before{background:radial-gradient(700px 360px at 88% -8%,rgba(255,45,79,.10),transparent 62%)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== v17 upgrade: dropdown, switches, keys panel, watermark, motion ===== */
.msg{content-visibility:auto;contain-intrinsic-size:auto 140px}
.msg.fresh{animation:in .28s ease-out both}
.msg.error .acts.show{opacity:1}
button.sm{padding:4px 11px;font-size:11px}
.tag.mode{color:var(--red2);border-color:rgba(255,45,79,.42)}
.gen-img{width:100%;max-width:640px;border-radius:10px;border:1px solid var(--line2);display:block}
.gen-link{font-size:12px;color:var(--red2);display:inline-block;margin-top:8px}
.dd{position:relative;display:inline-block}
.dd-btn{min-width:132px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-radius:9px;background:linear-gradient(180deg,#15151b,#0c0c10);border:1px solid var(--line2);font-family:var(--mono);font-size:12px;letter-spacing:.03em;color:#fff}
.dd-btn::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--red2);transition:transform .2s}
.dd.open .dd-btn{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,45,79,.14)}
.dd.open .dd-btn::after{transform:rotate(180deg)}
.dd-menu{position:absolute;bottom:calc(100% + 8px);left:0;min-width:100%;background:#0d0d12;border:1px solid var(--line2);border-radius:11px;padding:5px;box-shadow:0 18px 50px rgba(0,0,0,.75);z-index:30;animation:ddIn .16s ease-out both}
.dd-menu[hidden]{display:none!important}
@keyframes ddIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dd-item{padding:8px 12px;border-radius:7px;font-family:var(--mono);font-size:12px;cursor:pointer;color:#d9d1d5;white-space:nowrap}
.dd-item:hover{background:rgba(255,45,79,.12);color:#fff}
.dd-item.on{color:#fff;background:linear-gradient(90deg,rgba(255,45,79,.3),rgba(255,45,79,.05));box-shadow:inset 2px 0 0 var(--red)}
.chk input[type=checkbox]{appearance:none;-webkit-appearance:none;width:34px;height:18px;border-radius:999px;background:#1a1a20;border:1px solid var(--line2);position:relative;cursor:pointer;transition:background .18s,border-color .18s;margin:0;flex:0 0 auto}
.chk input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#7b6a71;transition:transform .18s,background .18s}
.chk input[type=checkbox]:checked{background:linear-gradient(90deg,var(--red3),var(--red));border-color:var(--red)}
.chk input[type=checkbox]:checked::after{transform:translateX(16px);background:#fff}
.keylist{display:grid;gap:8px}
.keyrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#0b0b0f}
.keyhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:13px}
.kstat{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kstat.set{color:var(--ok)}
.keyinp{display:grid;grid-template-columns:1fr auto auto;gap:6px}
.keyinp input{padding:7px 9px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.pill.mode-pill{color:#ffc4ce}
#wm{padding:8px 12px 10px;text-align:center;font-size:11px;letter-spacing:.14em;color:#7d6f76;border-top:1px solid var(--line);background:#07070a;flex:0 0 auto}
#wm b{font-weight:900;letter-spacing:.18em;background:linear-gradient(90deg,#ff2d4f,#ffd0d7,#ff2d4f);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 3.6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.modal .muted{color:var(--muted);font-size:12px}
@media(max-width:820px){.keyinp{grid-template-columns:1fr}}

/* ===== v18 upgrade ===== */
button{transition:transform .12s,border-color .15s,color .15s,background .15s,box-shadow .15s}
button:hover:not(:disabled){box-shadow:0 0 0 3px rgba(255,45,79,.1)}
button:active:not(:disabled){transform:scale(.97)}

  if(intent==="reasoning"&&/r1|gpt-oss|deepseek|glm|kimi|qwen3|reason|nemotron|qwq/i.test(r.model))v+=24;
  if(intent==="search"&&/gpt-oss|gemini|deepseek|glm|kimi|qwen|llama|mistral/i.test(r.model))v+=14;

function eligible(intent){
  let list=ROUTES.filter(r=>sendable(r,false));

}
function orderAvoiding(list,avoid){const a=(avoid||[]).filter(Boolean);return list.filter(r=>!a.includes(r.provider)).concat(list.filter(r=>a.includes(r.provider)));}
function distinctProviders(list,n){const seen=new Set(),out=[];for(const r of list){if(seen.has(r.provider))continue;seen.add(r.provider);out.push(r);if(out.length>=n)break;}return out;}

/* ---------- guards: local budgets, input and output limits ---------- */
const LIMITS={maxInput:60000,maxFiles:6,maxFileBytes:600000,maxOutput:400000,sendsPerMin:14,routeReqsPerMin:24};
const guard={sends:[],routeHits:new Map(),lastSend:0};
function allowSend(){
  const now=Date.now();
  if(now-guard.lastSend<350)return false;
  guard.sends=guard.sends.filter(x=>now-x<60000);
  if(guard.sends.length>=LIMITS.sendsPerMin)return false;
  guard.sends.push(now);guard.lastSend=now;return true;
}
function allowRoute(id){
  const now=Date.now();
  const arr=(guard.routeHits.get(id)||[]).filter(x=>now-x<60000);
  if(arr.length>=LIMITS.routeReqsPerMin){guard.routeHits.set(id,arr);return false;}
  arr.push(now);guard.routeHits.set(id,arr);return true;
}
const safeUrl=u=>/^https?:\/\/[^\s"'<>]+$/i.test(String(u||""));

function tailPreview(t){const s=t.slice(-340);const i=s.indexOf(" ");return (i>0&&i<40?s.slice(i+1):s).replace(/\s+/g," ").trim();}

/* ---------- smart routing: task weight and mode choice ---------- */
function taskWeight(text,atts){
  const t=String(text).toLowerCase();
  const size=String(text).length+(atts||[]).reduce((n,a)=>n+String(a&&a.text||"").length,0);
  const hard=/\b(full|complete|production|advanced|architecture|multi[- ]?file|end.to.end|scalable|secure|refactor|from scratch|comprehensive|detailed|long|project|application|platform)\b/.test(t);
  return (hard||size>1200||(atts||[]).length>0)?"full":"light";
}
function smartPlan(text,atts,searchOn){
  const t=String(text).toLowerCase();
  const weight=taskWeight(text,atts);
  const build=/\b(build|create|make|develop|design|implement|program|code)\b/.test(t)&&
    /\b(app|application|website|web ?site|page|game|tool|dashboard|api|backend|frontend|system|bot|extension|script|project|platform|saas|plugin|cli|service|engine|workbench|component|function|class)\b/.test(t);
  const video=/\b(video|vid|clip|reel|animation|animate|storyboard|cinematic|text[- ]to[- ]video)\b/.test(t);
  const image=/\b(image|photo|picture|logo|wallpaper|artwork|illustration|drawing|painting|portrait|poster|icon|sketch)\b/.test(t)&&
    /\b(make|create|generate|draw|paint|render|design|give me|show me|produce|imagine)\b/.test(t);
  const deepWords=/\b(deep search|deep research|deep dive|investigate|find sources|with sources|sources|latest|news|look up|research|search the web|find out)\b/.test(t);
  const url=/https?:\/\//.test(t);
  const reason=/\b(prove|derive|solve|calculate|theorem|equation|proof|reason)\b/.test(t);
  if(video&&!build)return {mode:"video",verify:false,light:false,research:false,why:"video prompt pack"};
  if(image&&!build)return {mode:"image",verify:false,light:true,research:false,why:"image generation"};
  if(build)return {mode:"agents",verify:weight==="full",light:weight==="light",research:false,why:weight==="full"?"hard build":"build"};
  if(deepWords||(searchOn&&weight==="full")||(url&&weight==="full"))return {mode:"deep",verify:true,light:false,research:true,why:"deep search"};
  if(searchOn||url)return {mode:"single",verify:true,light:false,research:true,why:"web research"};
  if(reason)return {mode:"single",verify:true,light:false,research:false,why:"reasoning"};
  if(weight==="full")return {mode:"single",verify:true,light:false,research:false,why:"long answer"};
  return {mode:"single",verify:false,light:true,research:false,why:"quick answer"};
}

/* ---------- custom dropdown bound to a hidden select ---------- */
function buildDropdown(sel){
  const wrap=el("div","dd");
  const btn=el("button","dd-btn");btn.type="button";
  const menu=el("div","dd-menu");menu.hidden=true;
  for(const o of [...sel.options]){
    const it=el("div","dd-item",o.textContent);it.dataset.v=o.value;
    it.onclick=e=>{e.stopPropagation();sel.value=o.value;sel.dispatchEvent(new Event("change"));closeDD();refreshDD(sel);};
    menu.appendChild(it);
  }
  const closeDD=()=>{menu.hidden=true;wrap.classList.remove("open");};
  btn.onclick=e=>{e.stopPropagation();const open=menu.hidden;document.querySelectorAll(".dd.open").forEach(x=>x.dispatchEvent(new Event("dd-close")));menu.hidden=!open;wrap.classList.toggle("open",open);};
  wrap.addEventListener("dd-close",closeDD);
  wrap.append(btn,menu);
  sel.hidden=true;sel.after(wrap);
  sel._dd={wrap,btn,menu};
  document.addEventListener("click",closeDD);
  refreshDD(sel);
}
function refreshDD(sel){
  const d=sel._dd;if(!d)return;
  const o=[...sel.options].find(x=>x.value===sel.value);
  d.btn.textContent=o?o.textContent:sel.value;
  for(const it of d.menu.children)it.classList.toggle("on",it.dataset.v===sel.value);
}

/* ---------- in-browser model: no key, no account, no proxy ----------
   Transformers.js from jsDelivr runs an ONNX model inside the page (WebGPU when available, WASM otherwise).
   The first load downloads the weights; the browser caches them after that. */
let LOCAL={id:"",gen:null,mod:null,loading:null};
function cleanLocal(t){return String(t||"").replace(/<think>[\s\S]*?(<\/think>|$)/g,"").replace(/^\s+/,"");}
function insertTpl(t){const i=$("input");i.value=t;i.focus();autosize();}
async function loadLocal(modelId,onProgress){
  const id=String(modelId||DEFAULT_LOCAL).trim()||DEFAULT_LOCAL;
  if(LOCAL.gen&&LOCAL.id===id)return LOCAL.gen;

  if(typeof WebAssembly==="undefined")throw new Error("this browser has no WebAssembly");
  LOCAL.id=id;
  LOCAL.loading=(async()=>{

    let gen=null;
    if(navigator.gpu){try{gen=await mod.pipeline("text-generation",id,Object.assign({device:"webgpu"},opts));}catch(e){gen=null;}}

async function runLocal(ctx,msgs){
  const gen=await loadLocal(state.localModel,p=>{
    if(p&&p.status==="progress"&&p.progress!=null)setStatus("Local model · downloading "+Math.round(p.progress)+"%","run");
  });
  if(ctx.signal.aborted)throw abortErr();
  setStatus("Local model · generating","run");
  const q=[];let wake=null,done=false,err=null;
  const poke=()=>{if(wake){const w=wake;wake=null;w();}};
  const streamer=new LOCAL.mod.TextStreamer(gen.tokenizer,{
    skip_prompt:true,skip_special_tokens:true,
    callback_function:t=>{if(!ctx.signal.aborted){q.push(t);poke();}}
  });
  const chat=msgs.map(m=>({role:m.role,content:typeof m.content==="string"?m.content:JSON.stringify(m.content)}));
  Promise.resolve(gen(chat,{max_new_tokens:700,do_sample:true,temperature:Math.max(0.1,Number(state.temperature)||0.7),streamer}))
    .then(()=>{done=true;poke();},e=>{err=e;done=true;poke();});
  let raw="";
  while(true){
    if(ctx.signal.aborted)throw abortErr();
    if(q.length){raw+=q.shift();ctx.onText(cleanLocal(raw));continue;}
    if(done)break;

  if(err&&!raw)throw err;

}
/* Single with the in-browser model as the last resort (only when cloud routes all fail). */

/* ---------- streaming with idle and total timeouts ---------- */
/* ---------- streaming with idle and total timeouts ---------- */
async function* streamRoute(route,messages,signal,opts){
  if(!allowRoute(route.id)){const e=new Error("local rate limit reached for "+route.label);e.name="RateLimited";throw e;}
  const started=Date.now();
  const ctrl=new AbortController();
  const onAbort=()=>ctrl.abort();
  signal.addEventListener("abort",onAbort,{once:true});
  const idleMs=(opts&&opts.idleMs)||(route.timeout||20)*1000;
  const totalMs=(opts&&opts.totalMs)||Math.max(idleMs*4,180000);
  let timedOut="",idleT=null;
  const arm=()=>{clearTimeout(idleT);idleT=setTimeout(()=>{timedOut="idle";ctrl.abort();},idleMs);};
  const totalT=setTimeout(()=>{timedOut="total";ctrl.abort();},totalMs);
  arm();
  let got=false;
  try{
    if(route.adapter==="puter"){
      if(!window.puter||!puter.ai||typeof puter.ai.chat!=="function")throw new Error("Puter.js is not loaded");
      const pm=messages.map(m=>({role:m.role,content:typeof m.content==="string"?m.content:JSON.stringify(m.content)}));
      const r=await puter.ai.chat(pm,{model:route.model});
      const content=typeof r==="string"?r:((r&&r.message&&r.message.content)||(r&&r.text)||"");
      if(!content)throw new Error("Puter returned an empty response");
      recordOk(route,Date.now()-started);
      yield {type:"delta",text:String(content)};
      yield {type:"end",finish:"stop"};
      return;
    }
    if(route.adapter==="aihorde"){
      const hh={"Content-Type":"application/json","Client-Agent":"ZTCAI:1.7.0:browser"};
      const cat=await (await sigFetch("https://aihorde.net/api/v2/status/models?type=text&chat=true",{signal:ctrl.signal})).json();
      const names=(Array.isArray(cat)?cat:(cat.models||[])).map(m=>m.name||m.model||m.id||m).filter(x=>typeof x==="string").slice(0,5);
      if(!names.length)throw new Error("AI Horde has no active text models");
      const st=await sigFetch("https://aihorde.net/api/v2/generate/chat/async",{method:"POST",headers:hh,signal:ctrl.signal,
        body:JSON.stringify({models:names,stream:false,max_tokens:(opts&&opts.maxTokens)||700,
          messages:messages.map(m=>({role:m.role==="developer"?"system":m.role,content:typeof m.content==="string"?m.content:JSON.stringify(m.content)})),
          horde:{availability_mode:"wait",context_fit:"truncate_oldest"}})});
      const job=await st.json();const jid=job.id||job.uuid;
      if(!jid)throw new Error("AI Horde did not return a job id");
      const deadline=Date.now()+Math.min(idleMs*2,85000);let text="";
      while(Date.now()<deadline){
        await sleep(1800);
        const c=await (await sigFetch("https://aihorde.net/api/v2/generate/chat/status/"+encodeURIComponent(jid),{headers:{"Client-Agent":hh["Client-Agent"]},signal:ctrl.signal})).json();
        if(c.fault_reason)throw new Error("AI Horde: "+c.fault_reason);
        if(c.done){const g=c.generations&&c.generations[0];text=g&&g.message&&typeof g.message.content==="string"?g.message.content:"";break;}
      }
      if(!text)throw new Error("AI Horde timed out");
      recordOk(route,Date.now()-started);
      yield {type:"delta",text};
      yield {type:"end",finish:"stop"};
      return;
    }
    const headers=Object.assign({"Content-Type":"application/json"},route.headers||{});
    const key=keyFor(route);if(key)headers.Authorization="Bearer "+key;
    const body={model:route.model,stream:route.stream!==false&&route.provider!=="Free.ai",messages};
    if(opts&&opts.maxTokens)body.max_tokens=opts.maxTokens;
    body.temperature=(opts&&opts.temperature!==undefined)?opts.temperature:state.temperature;
    const url=route.url.replace("{accountId}",encodeURIComponent(state.cloudflareAccountId||""));
    const res=await fetchWithRetry(url,{method:"POST",headers,body:JSON.stringify(body)},ctrl.signal);
    arm();
    for await(const ev of readSSE(res,ctrl.signal)){
      arm();
      if(ev.type==="delta")got=true;
      yield ev;
    }
    if(!got)throw new Error("empty stream");
    recordOk(route,Date.now()-started);
  }catch(e){
    if((e.name==="AbortError"||ctrl.signal.aborted)&&!timedOut)throw abortErr();
    if(e.name==="RateLimited")throw e;
    let err=e;
    if(timedOut==="idle")err=new Error("no data for "+Math.max(1,Math.round(idleMs/1000))+"s");
    else if(timedOut==="total")err=new Error("exceeded "+Math.round(totalMs/1000)+"s");
    recordFail(route,err);
    throw err;
  }finally{clearTimeout(idleT);clearTimeout(totalT);signal.removeEventListener("abort",onAbort);}
}

/*@@HEDGE@@*/
function parseJudge(text){
  const t=cleanModelText(text||"");const s=t.indexOf("{"),e=t.lastIndexOf("}");
  if(s<0||e<=s)return null;
  try{return JSON.parse(t.slice(s,e+1));}catch(err){return null;}
}
/* Hedged race: launches routes staggered; the first route that produces text wins and the rest are cancelled. */
async function* hedgedStream(routes,messages,signal,opts,staggerMs){
  if(!routes.length)throw new Error("no routes available");
  const ctrls=new Map(),q=[];let wake=null,winner=null,failed=0,lastErr=null;
  const push=ev=>{q.push(ev);if(wake){const w=wake;wake=null;w();}};
  const onAbort=()=>{ctrls.forEach(c=>c.abort());push({type:"abort"});};
  signal.addEventListener("abort",onAbort,{once:true});
  const errs=[];
  const fail=e=>{failed++;lastErr=e||lastErr;if(e)errs.push(String(e.message||e).slice(0,120));if(failed>=routes.length&&!winner)push({type:"allfailed",err:new Error("all routes failed · "+errs.slice(0,3).join(" | "))});};
  routes.forEach((route,i)=>{
    const ctrl=new AbortController();ctrls.set(route.id,ctrl);
    (async()=>{
      try{
        if(i>0)await sleep(i*staggerMs);
        if(winner||signal.aborted)return;
        for await(const ev of streamRoute(route,messages,ctrl.signal,opts)){
          if(winner&&winner!==route.id)return;
          if(!winner){
            if(ev.type!=="delta")continue;
            winner=route.id;
            ctrls.forEach((c,k)=>{if(k!==route.id)c.abort();});
            push({type:"winner",route});
          }
          push(ev);
        }
        if(winner===route.id)push({type:"done"});
        else fail(new Error("no output from "+route.label));
      }catch(e){
        if(winner&&winner!==route.id)return;
        if(winner===route.id){push({type:"error",err:e});return;}
        if(e.name==="AbortError"&&signal.aborted)return;
        fail(e);
      }
    })();
  });
  try{
    while(true){
      if(!q.length){await new Promise(r=>{wake=r;});continue;}
      const ev=q.shift();
      if(ev.type==="abort")throw abortErr();
      if(ev.type==="done")return;
      if(ev.type==="error"||ev.type==="allfailed")throw ev.err;
      yield ev;
    }
  }finally{
    ctrls.forEach(c=>{try{c.abort();}catch(e){}});
    signal.removeEventListener("abort",onAbort);
  }
}
/* Sequential failover: tries routes in order; a route that already produced text is never retried. */
async function* failoverStream(routes,messages,signal,opts){
  let last=null;const errs=[];
  for(const route of routes){
    if(signal.aborted)throw abortErr();
    let any=false;
    try{
      for await(const ev of streamRoute(route,messages,signal,opts)){
        if(ev.type==="delta"&&!any){any=true;yield {type:"winner",route};}
        yield ev;
      }
      if(any)return;
      last=new Error("no output from "+route.label);errs.push(route.label+": empty output");
    }catch(e){
      if(e.name==="AbortError"&&signal.aborted)throw e;
      last=e;errs.push(route.label+": "+String(e.message||e).slice(0,120));
      if(any)throw e;
    }
  }
  throw new Error(errs.length?"all routes failed · "+errs.slice(0,3).join(" | "):"no routes available");
}
/*@@HEDGE_END@@*/

const liveStats={chars:0,think:0,t0:0,timer:null};

function meterPaint(done){
  const m=$("meter");if(!m)return;

/* agent step: runs one role, streams into the live trace, records a result */
function paintTraceSoon(ctx){
  if(!ctx.el||ctx.paintQueued)return;
  ctx.paintQueued=true;
  requestAnimationFrame(()=>{ctx.paintQueued=false;renderTrace(ctx.el,ctx.trace,true);});
}
async function agentStep(ctx,role,label,routes,messages,opts){
  const step={role,label,route:"",provider:"",status:"running",ms:0,text:"",preview:"",verdict:"",error:""};
  ctx.trace.push(step);paintTraceSoon(ctx);
  const t0=Date.now();let text="";
  try{
    if(!routes.length)throw new Error("no sendable route");
    for await(const ev of failoverStream(routes,messages,ctx.signal,opts)){
      if(ev.type==="winner"){step.route=ev.route.label;step.provider=ev.route.provider;}
      else if(ev.type==="delta"){
        text+=ev.text;liveStats.chars+=ev.text.length;
        if(text.length>LIMITS.maxOutput)throw new Error("output exceeded the safety limit");
        step.preview=tailPreview(text);paintTraceSoon(ctx);
      }
      else if(ev.type==="reasoning"){liveStats.think+=ev.text.length;}
    }
    step.text=cleanModelText(text).trim();
    step.status=step.text?"done":"failed";
    if(!step.text)step.error="empty output";
  }catch(e){
    if(e.name==="AbortError"&&ctx.signal.aborted)throw e;
    step.status="failed";step.error=String(e.message||e).slice(0,240);
  }
  step.ms=Date.now()-t0;
  if(step.status==="failed")step.preview=step.error;
  paintTraceSoon(ctx);
  return step;
}

/* ---------- orchestration modes ---------- */
async function runAgents(ctx,task,hist){
  const cands=eligible(ctx.intent);
  if(!cands.length)throw new Error("No sendable routes. Add a key or enable a route in Routes.");
  const sp=preset();
  const pick=avoid=>orderAvoiding(cands,avoid).slice(0,8);
  const sys=p=>({role:"system",content:p});
  const base=[sys(ctx.system+"\n\n"+PROMPTS.builder),...hist.slice(0,-1)];
  const lastUser=hist[hist.length-1].content;
  let planText="";
  if(!ctx.light){
    const plan=await agentStep(ctx,"planner","Planner",pick([]),[sys(PROMPTS.planner),{role:"user",content:lastUser}],{maxTokens:600,temperature:0.3,idleMs:40000});
    planText=plan.text;
  }
  const planBlock=planText?"\n\nPlan from the planner:\n"+planText:"";
  const built=await agentStep(ctx,"builder","Builder",pick([]),[...base,{role:"user",content:lastUser+planBlock}],
    {maxTokens:ctx.light?1400:3200,idleMs:70000});
  let out=built.text,builderProv=built.provider||"",revProv="";
  if(!out)throw new Error("Builder produced no output: "+(built.error||"unknown error"));
  const rounds=ctx.light?0:sp.rounds;
  for(let round=0;round<rounds;round++){
    const rev=await agentStep(ctx,"reviewer","Reviewer "+(round+1),pick([builderProv]),
      [sys(PROMPTS.reviewer),{role:"user",content:"TASK:\n"+lastUser+(planText?"\n\nPLAN:\n"+planText:"")+"\n\nDELIVERABLE:\n"+out}],
      {maxTokens:700,temperature:0.2,idleMs:45000});
    revProv=rev.provider||revProv;
    const j=parseJudge(rev.text);
    rev.verdict=j&&j.verdict?String(j.verdict).toUpperCase():"UNPARSED";
    paintTraceSoon(ctx);
    if(!j||rev.verdict!=="REVISE"||!Array.isArray(j.issues)||!j.issues.length)break;
    const same=cands.filter(r=>r.provider===builderProv);
    const fixRoutes=same.concat(cands.filter(r=>r.provider!==builderProv)).slice(0,8);
    const fix=await agentStep(ctx,"builder","Builder fix "+(round+1),fixRoutes,
      [...base,{role:"user",content:lastUser+"\n\nPrevious deliverable:\n"+out+"\n\nReviewer issues to fix:\n- "+j.issues.join("\n- ")+"\n\nReturn the full corrected deliverable."}],
      {maxTokens:3200,idleMs:70000});
    if(fix.text){out=fix.text;builderProv=fix.provider||builderProv;}
  }
  let verdict="",ver=null,final=out;
  if(!ctx.light||ctx.verifyOn){
    ver=await agentStep(ctx,"verifier","Verifier",pick([builderProv,revProv]),
      [sys(PROMPTS.verifier),{role:"user",content:"TASK:\n"+lastUser+"\n\nDELIVERABLE:\n"+out}],{maxTokens:600,temperature:0.1,idleMs:40000});
    const vj=parseJudge(ver.text);
    verdict=vj&&vj.verdict?String(vj.verdict).toUpperCase():"UNPARSED";
    ver.verdict=verdict;paintTraceSoon(ctx);
    const issues=vj&&Array.isArray(vj.issues)?vj.issues.filter(Boolean):[];
    if((verdict==="FAIL"||verdict==="WARN")&&issues.length){
      const syn=await agentStep(ctx,"synth","Synthesizer",pick([builderProv]),
        [sys(PROMPTS.synth),{role:"user",content:"TASK:\n"+lastUser+"\n\nDELIVERABLE:\n"+out+"\n\nVERIFIER FINDINGS:\n- "+issues.join("\n- ")+"\n\nOutput the corrected final answer only."}],
        {maxTokens:3200,idleMs:70000});
      if(syn.text)final=syn.text;
    }
  }
  return {text:final,verdict,providers:[builderProv,revProv,ver&&ver.provider].filter(Boolean)};
}

async function runCouncil(ctx,task,hist){
  const cands=eligible(ctx.intent);
  if(!cands.length)throw new Error("No sendable routes. Add a key or enable a route in Routes.");
  const heads=distinctProviders(cands,3);
  const results=await Promise.all(heads.map((r,i)=>{
    const backups=cands.filter(x=>x.provider!==r.provider).slice(0,2);
    return agentStep(ctx,"draft","Draft "+(i+1),[r].concat(backups),[{role:"system",content:ctx.system},...hist],{maxTokens:1800,idleMs:50000});
  }));
  const good=results.filter(s=>s.text);
  if(!good.length)throw new Error("Council: no draft produced output. "+results.map(s=>s.error).filter(Boolean).slice(0,2).join("; "));
  if(good.length===1)return {text:good[0].text,providers:[good[0].provider]};
  const used=good.map(g=>g.provider);
  const prompt="Several independent answers to the same request follow. Compare them, resolve disagreements, remove unsupported claims and keep the best detail. Output one complete answer.\n\n"+
    good.map((g,i)=>"--- Answer "+(i+1)+" ("+g.route+") ---\n"+g.text).join("\n\n")+"\n\n--- Request ---\n"+task;
  const syn=await agentStep(ctx,"synth","Synthesizer",orderAvoiding(cands,used).slice(0,8),
    [{role:"system",content:ctx.system},{role:"user",content:prompt}],{maxTokens:3200,idleMs:70000});
  return {text:syn.text||good[0].text,providers:used};
}

async function runSingle(ctx,msgs){
  const sp=preset();
  const routes=eligible(ctx.intent).slice(0,sp.maxRoutes);
  if(!routes.length)throw new Error("No sendable routes. Add a key or enable a route in Routes.");
  let out="",winner=null;const conts=[];
  for(let round=0;round<sp.contRounds;round++){
    let got="",finish=null;
    const send=conts.length?msgs.concat(conts):msgs;
    for await(const ev of hedgedStream(routes,send,ctx.signal,{idleMs:45000},sp.stagger)){
      if(ev.type==="winner")winner=ev.route;
      else if(ev.type==="delta"){
        got+=ev.text;liveStats.chars+=ev.text.length;
        if(out.length+got.length>LIMITS.maxOutput)throw new Error("output exceeded the safety limit");
        ctx.onText(cleanModelText(out+got));
      }
      else if(ev.type==="reasoning")liveStats.think+=ev.text.length;
      else if(ev.type==="end")finish=ev.finish;
    }
    out+=got;
    if(!needsContinue(got,finish))break;
    conts.push({role:"assistant",content:got},{role:"user",content:"Continue exactly from where you stopped. Do not repeat any text already written."});
  }
  return {text:cleanModelText(out).trim(),route:winner};
}
function needsContinue(text,finish){
  if(!text)return false;
  if(finish==="length"||finish==="max_tokens")return true;
  return (text.match(/```/g)||[]).length%2===1;
}

/* ---------- research (keyless: Jina reader for URLs, Wikipedia for search) ---------- */
async function research(text,searchOn,signal,deep){
  const sources=[],extra=[];
  const urls=(text.match(/https?:\/\/[^\s)"'<>]+/g)||[]).slice(0,2);
  for(const u of urls){
    try{
      const r=await sigFetch("https://r.jina.ai/"+u,{headers:{Accept:"text/plain"},signal});
      if(r.ok){const body=(await r.text()).slice(0,6000);extra.push("[Page: "+u+"]\n"+body);sources.push({title:u,url:u});}
    }catch(e){if(signal.aborted)throw abortErr();}
  }
  const q=text.replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim().slice(0,200);
  if(searchOn&&q){
    try{
      const lim=deep?8:4;
      const url="https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch="+encodeURIComponent(q)+
        "&gsrlimit="+lim+"&prop=extracts|info&inprop=url&exintro=1&explaintext=1&exlimit=max&format=json&origin=*";
      const j=await (await sigFetch(url,{signal})).json();
      const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
      for(const p of pages){extra.push("[Source: "+p.title+" ("+p.fullurl+")]\n"+String(p.extract||"").slice(0,deep?1200:1500));sources.push({title:p.title,url:p.fullurl});}
      if(deep){
        const top=pages.slice(0,3).filter(p=>safeUrl(p.fullurl));
        await Promise.all(top.map(async p=>{
          try{
            const r=await sigFetch("https://r.jina.ai/"+p.fullurl,{headers:{Accept:"text/plain"},signal});
            if(r.ok){const body=(await r.text()).slice(0,4000);extra.push("[Full page: "+p.title+"]\n"+body);}
          }catch(e){if(signal.aborted)throw abortErr();}
        }));
      }
    }catch(e){if(signal.aborted)throw abortErr();}
  }
  return {extra,sources};
}

/* ---------- message building ---------- */
function intentOf(t){
  const q=String(t||"");
  if(/```|\b(code|function|class|bug|error|stack ?trace|typescript|javascript|python|html|css|api|script|refactor|compile|debug|sql)\b|\.(js|ts|py|html|css|json|sql)\b/i.test(q))return "code";
  if(/\b(prove|derive|solve|calculate|integral|equation|theorem|step by step|reason|logic|math|formula)\b/i.test(q))return "reasoning";
  if(/\b(search|research|look up|find sources|deep dive|latest|current information|compare providers|verify online|browse the web)\b/i.test(q))return "search";
  if(/\b(design|redesign|ui|ux|interface|dashboard|landing page|wireframe|prototype|visual style|layout|theme|frontend design|high.?tech)\b/i.test(q))return "design";
  if(/\b(write|draft|compose|story|poem|caption|speech|essay|creative|brainstorm|generate ideas)\b/i.test(q))return "creative";
  return "general";
}
function userContent(m,extra){
  let s=m.content||"";
  for(const a of m.attachments||[])s+="\n\n[File: "+a.name+"]\n```\n"+a.text+"\n```";
  if(extra&&extra.length)s="Use the research below when relevant and name the sources you use.\n\n"+extra.join("\n\n")+"\n\nRequest:\n"+s;
  return s;
}
function historyFor(chat,max){
  max=max||28000;
  const all=chat.messages.filter(m=>m.role==="user"||m.role==="assistant")
    .map(m=>({role:m.role,content:m.role==="user"?userContent(m,null):(m.content||"")}));
  const out=[];let total=0;
  for(let i=all.length-1;i>=0;i--){
    total+=all[i].content.length;
    if(out.length&&total>max)break;
    out.unshift(all[i]);
  }
  return out;
}

/* ---------- generation ---------- */
const MODE_NAME={auto:"Auto",agents:"Agents",council:"Council",single:"Single",image:"Image",video:"Video prompt",deep:"Deep search",local:"Local model"};
const VIDEO_SYSTEM="You are an expert AI video director. Produce a production-ready text-to-video prompt pack with these sections: Logline; Shot list (each shot with its duration in seconds); Visual style (lens, lighting, color palette); Camera motion per shot; Subject and action details; Audio cues; Negative prompt. Be specific, vivid and concise.";
const imageUrl=p=>"https://image.pollinations.ai/prompt/"+encodeURIComponent(sanitizeText(p,900))+"?width=1024&height=1024&nologo=true&seed="+Math.floor(Math.random()*1e6);
async function generate(chat,userMsg,opt){
  runtime.busy=true;setBusy(true);
  const ctl=new AbortController();runtime.ctl=ctl;
  const atts=userMsg.attachments||[];
  const plan=opt.mode==="auto"?smartPlan(userMsg.content,atts,opt.searchOn):
    {mode:opt.mode,verify:false,light:taskWeight(userMsg.content,atts)==="light",research:false,why:"manual"};
  if(opt.verifyOn&&plan.mode!=="image")plan.verify=true;
  const mode=plan.mode;
  const intent=intentOf(userMsg.content+" "+atts.map(a=>a.name).join(" "));
  const bubble=el("div","msg assistant streaming");
  const traceEl=el("div"),bodyEl=el("div","body");
  bubble.append(traceEl,bodyEl);
  $("messages").appendChild(bubble);scrollEnd();
  const ctx={signal:ctl.signal,intent,trace:[],el:traceEl,paintQueued:false,partial:"",textQ:false,
    light:mode==="agents"&&plan.light===true,verifyOn:!!plan.verify,
    system:(intent==="code"?CODE_SYSTEM+"\n\n":"")+(state.system||SYSTEM_DEFAULT),
    onText:t=>{ctx.partial=t;if(!ctx.textQ){ctx.textQ=true;requestAnimationFrame(()=>{ctx.textQ=false;bodyEl.textContent=ctx.partial;scrollEnd();});}}};
  const meta={provider:"",sources:[],verdict:"",stopped:false,image:""};
  let answer="",errMsg="";
  setStatus((opt.mode==="auto"?"Auto → ":"")+MODE_NAME[mode]+" · "+plan.why,"run");
  meterStart();
  try{
    if(mode==="image"){
      meta.image=imageUrl(userMsg.content);
      meta.provider="Pollinations image";
      answer="Image generated for: "+userMsg.content;
    }else{
      const r=await research(userMsg.content,opt.searchOn||plan.research,ctl.signal,mode==="deep");
      meta.sources=r.sources;
      const hist=historyFor(chat);
      const task=userContent(userMsg,r.extra);
      hist[hist.length-1]={role:"user",content:task};
      if(mode==="agents"){
        setStatus("Agents · "+(ctx.light?"fast build":"full pipeline"),"run");
        let a;
        try{a=await runAgents(ctx,task,hist);}
        catch(err){
          if(err.name==="AbortError"||ctl.signal.aborted||!state.autoFallback)throw err;
          setStatus("Agents failed · retrying as Single","run");
          const s=await singleWithLocal(ctx,[{role:"system",content:ctx.system},...hist]);
          if(!s.text)throw err;
          a={text:s.text,verdict:"",providers:["fallback · "+(s.route?s.route.label:"single")]};
        }
        answer=a.text;meta.verdict=a.verdict;meta.provider="agents · "+a.providers.join(" > ");
      }else if(mode==="council"||(mode==="deep"&&eligible(intent).length>=3)){
        setStatus("Council · synthesizing sources","run");
        let c;
        try{c=await runCouncil(ctx,task,hist);}
        catch(err){
          if(err.name==="AbortError"||ctl.signal.aborted||!state.autoFallback)throw err;
          setStatus("Council failed · retrying as Single","run");
          const s=await singleWithLocal(ctx,[{role:"system",content:ctx.system},...hist]);
          if(!s.text)throw err;
          c={text:s.text,providers:["fallback · "+(s.route?s.route.label:"single")]};
        }
        answer=c.text;meta.provider="council · "+c.providers.length+" drafts";
      }else{
        const sysPrompt=mode==="video"?VIDEO_SYSTEM+"\n\n"+ctx.system:ctx.system;
        setStatus(mode==="video"?"Video prompt director":mode==="deep"?"Deep search · single":mode==="local"?"Local model":"Single · hedged race","run");
        const s=mode==="local"?await runLocal(ctx,[{role:"system",content:sysPrompt},...hist]):await singleWithLocal(ctx,[{role:"system",content:sysPrompt},...hist]);
        answer=s.text;meta.provider=s.route?s.route.label:"";
        if(plan.verify&&answer){
          setStatus("Verifier","run");
          const v=await agentStep(ctx,"verifier","Verifier",orderAvoiding(eligible(intent),s.route?[s.route.provider]:[]).slice(0,8),
            [{role:"system",content:PROMPTS.verifier},{role:"user",content:"TASK:\n"+task+"\n\nDELIVERABLE:\n"+answer}],{maxTokens:600,temperature:0.1,idleMs:40000});
          const j=parseJudge(v.text);v.verdict=j&&j.verdict?String(j.verdict).toUpperCase():"UNPARSED";
          meta.verdict=v.verdict;
        }
      }
      if(mode==="video"&&answer)meta.image=imageUrl("cinematic first frame, "+userMsg.content);
    }
    if(!answer.trim())throw new Error("The models returned an empty answer.");
  }catch(e){
    if(e.name==="AbortError"||ctl.signal.aborted){answer=ctx.partial||"";meta.stopped=true;}
    else{errMsg=e.message||String(e);if(/Failed to fetch/.test(errMsg))errMsg+=" · the browser blocked the cloud calls (CORS) or you are offline. Try Local mode.";}
  }
  bubble.remove();
  const now=Date.now();
  if(errMsg){
    chat.messages.push({role:"error",content:"Error: "+errMsg,t:now});
    setStatus("Failed","bad");
  }else if(answer.trim()||ctx.trace.length||meta.image){
    chat.messages.push({role:"assistant",content:answer.trim()||"(stopped before output)",provider:meta.provider,
      verdict:meta.verdict,sources:meta.sources,image:meta.image||undefined,mode,t:now,
      trace:ctx.trace.map(s=>({label:s.label,role:s.role,route:s.route,provider:s.provider,status:s.status,ms:s.ms,verdict:s.verdict,error:s.error}))});
    setStatus(meta.stopped?"Stopped":"Done · "+MODE_NAME[mode],meta.stopped?"":"ok");
  }else setStatus("Stopped","");
  runtime.busy=false;runtime.ctl=null;setBusy(false);meterStop();
  if(chat.title==="New chat"&&userMsg.content)chat.title=userMsg.content.slice(0,56);
  saveSoon();renderSidebar();
  const last=chat.messages[chat.messages.length-1];
  if(last&&last.role!=="user"){$("messages").appendChild(messageNode(last,chat.messages.length-1));scrollEnd();}
}

async function sendFromInput(){
  if(runtime.busy)return;
  const chat=activeChat();if(!chat)return;
  const input=$("input");
  const raw=input.value.trim();
  if(raw.length>LIMITS.maxInput){toast("Message too long. Limit is "+LIMITS.maxInput+" characters.");return;}
  let text=sanitizeText(raw);
  if(!text&&!runtime.pending.length)return;
  if(!allowSend()){toast("Slow down: too many requests in a short time.");return;}
  if(text.startsWith("/img ")){input.value="";autosize();generateImage(text.slice(5).trim(),chat);return;}
  let mode=state.mode,searchOn=$("togSearch").checked,verifyOn=$("togVerify").checked;
  const cmd=text.match(/^\/(search|agents|council|single|auto|verify|image|video|deep|local)\s+/);
  if(cmd){
    if(cmd[1]==="search")searchOn=true;
    else if(cmd[1]==="verify")verifyOn=true;
    else mode=cmd[1];
    text=text.slice(cmd[0].length).trim();
  }
  if(text==="/continue")text="Continue exactly from where the last answer stopped. Do not repeat any text already written.";
  if(!text&&!runtime.pending.length)return;
  const userMsg={role:"user",content:text||"(files)",attachments:runtime.pending.splice(0),t:Date.now()};
  chat.messages.push(userMsg);
  input.value="";autosize();renderFiles();renderMessages();saveSoon();
  try{await generate(chat,userMsg,{mode,searchOn,verifyOn});}
  catch(e){toast("Error: "+(e.message||e));}
  finally{if(runtime.busy){runtime.busy=false;runtime.ctl=null;setBusy(false);meterStop();}}
}
function generateImage(prompt,chat){
  if(!prompt){toast("Describe the image after /img");return;}
  const seed=Math.floor(Math.random()*1e6);
  const url="https://image.pollinations.ai/prompt/"+encodeURIComponent(prompt)+"?width=1024&height=1024&nologo=true&seed="+seed;
  chat.messages.push({role:"user",content:"/img "+prompt,t:Date.now()});
  chat.messages.push({role:"assistant",content:"Generated image for: "+prompt,image:url,provider:"Pollinations image"});
  saveSoon();renderMessages();
}
function regenerate(idx){
  if(runtime.busy)return;
  const chat=activeChat();if(!chat)return;
  let u=idx-1;while(u>=0&&chat.messages[u].role!=="user")u--;
  if(u<0)return;
  const userMsg=chat.messages[u];
  chat.messages=chat.messages.slice(0,u+1);
  saveSoon();renderMessages();
  generate(chat,userMsg,{mode:state.mode,searchOn:$("togSearch").checked,verifyOn:$("togVerify").checked});
}
function editUser(idx){
  if(runtime.busy)return;
  const chat=activeChat();if(!chat)return;
  const m=chat.messages[idx];
  $("input").value=m.content;runtime.pending=(m.attachments||[]).slice();
  chat.messages=chat.messages.slice(0,idx);
  saveSoon();renderFiles();renderMessages();autosize();$("input").focus();
}

function speakText(t){

  catch(e){toast("Speech is not available here");}

function renderTrace(container,trace,live){

function renderRich(container,raw){
  const text=cleanModelText(raw);
  const re=/```([\w+#.-]*)\r?\n?([\s\S]*?)```/g;
  let last=0,m;
  const prose=s=>{if(!s||!s.trim())return;const w=el("div","body md");renderProse(w,s);container.appendChild(w);};
  while((m=re.exec(text))!==null){
    prose(text.slice(last,m.index));

    last=m.index+m[0].length;

}
function mdTable(rows){
  const cells=r=>r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(x=>x.trim());
  const head=cells(rows[0]);const body=rows.slice(2).map(cells);
  const t=document.createElement("table");const thead=document.createElement("thead");const hr=document.createElement("tr");
  for(const h of head){const c=document.createElement("th");appendInline(c,h);hr.appendChild(c);}
  thead.appendChild(hr);t.appendChild(thead);
  const tb=document.createElement("tbody");
  for(const r of body){const tr=document.createElement("tr");for(let k=0;k<head.length;k++){const c=document.createElement("td");appendInline(c,r[k]||"");tr.appendChild(c);}tb.appendChild(tr);}
  t.appendChild(tb);const wrap=document.createElement("div");wrap.className="tbl";wrap.appendChild(t);return wrap;
}
function renderProse(el2,text){
  let list=null;
  const lines=String(text).split("\n");
  for(let li=0;li<lines.length;li++){
    const raw=lines[li];
    const line=raw.replace(/\s+$/,"");
    if(/^\s*\|.*\|\s*$/.test(line)&&li+1<lines.length&&/^\s*\|?\s*:?-{2,}/.test(lines[li+1])){
      list=null;let j=li;const rows=[];
      while(j<lines.length&&/^\s*\|.*\|\s*$/.test(lines[j])){rows.push(lines[j]);j++;}
      el2.appendChild(mdTable(rows));li=j-1;continue;
    }
    let m=line.match(/^(#{1,6})\s+(.*)$/);
    if(m){list=null;const h=document.createElement(m[1].length<=1?"h3":m[1].length===2?"h4":"h5");appendInline(h,m[2]);el2.appendChild(h);continue;}
    m=line.match(/^\s*[-*]\s+(.*)$/);
    if(m){if(!list){list=document.createElement("ul");el2.appendChild(list);}const li=document.createElement("li");appendInline(li,m[1]);list.appendChild(li);continue;}
    if(!line.trim()){list=null;continue;}
    list=null;
    const p=document.createElement("p");appendInline(p,line);el2.appendChild(p);
  }
}
function appendInline(node,s){
  const re=/(\*\*[^*\n]+\*\*|`[^`\n]+`|\*[^*\s][^*\n]*\*)/g;
  let last=0,m;
  while((m=re.exec(s))!==null){
    if(m.index>last)node.appendChild(document.createTextNode(s.slice(last,m.index)));
    const t=m[0];let n;
    if(t.startsWith("**")){n=document.createElement("strong");n.textContent=t.slice(2,-2);}
    else if(t.startsWith("`")){n=document.createElement("code");n.textContent=t.slice(1,-1);}
    else{n=document.createElement("em");n.textContent=t.slice(1,-1);}
    node.appendChild(n);last=m.index+t.length;
  }
  if(last<s.length)node.appendChild(document.createTextNode(s.slice(last)));
}

function runJs(code,out){
  out.textContent="running";
  const id=uid();
  const frame=el("iframe");frame.setAttribute("sandbox","allow-scripts");frame.hidden=true;
  const lines=[];
  const onMsg=e=>{
    if(e.source!==frame.contentWindow||!e.data||e.data.ztc!==id)return;
    if(e.data.line==="[finished]")return;
    if(lines.length<400)lines.push(String(e.data.line).slice(0,2000));
    out.textContent=lines.join("\n")||"(no output)";
  };
  window.addEventListener("message",onMsg);
  const safe=String(code).slice(0,60000).replace(/<\/script/gi,"<\\/script");
  frame.srcdoc="<!doctype html><meta charset=\"utf-8\"><script>(function(){var id="+JSON.stringify(id)+";function s(t){parent.postMessage({ztc:id,line:String(t)},\"*\");}"+
    "console.log=function(){s(Array.prototype.map.call(arguments,function(a){return typeof a===\"object\"?JSON.stringify(a):String(a);}).join(\" \"));};"+
    "console.error=console.log;window.onerror=function(m){s(\"Error: \"+m);};})();<\/script><script>\n"+safe+"\n<\/script><script>parent.postMessage({ztc:"+JSON.stringify(id)+",line:\"[finished]\"},\"*\");<\/script>";
  document.body.appendChild(frame);
  setTimeout(()=>{window.removeEventListener("message",onMsg);frame.remove();if(!lines.length)out.textContent="(no output)";},6000);
}

  {k:"Toggle web research",run:()=>{state.search=!state.search;syncModes();saveSoon();}},
  {k:"Toggle verifier",run:()=>{state.verify=!state.verify;syncModes();saveSoon();}},
  {k:"Routes",run:openRoutes},
  {k:"Settings",run:openSettings},
  {k:"Export chat (Markdown)",run:exportChat},
  {k:"Export workspace (JSON)",run:exportWorkspace},
  {k:"Import workspace (JSON)",run:()=>$("importFile").click()},
  {k:"Stop response",run:()=>{if(runtime.ctl)runtime.ctl.abort();}},
  {k:"Clear this chat",run:clearChat}
];
let palSel=0,palItems=[];
function openPalette(){$("palette").hidden=false;$("palInput").value="";$("palInput").focus();filterPal("");}
function closePalette(){$("palette").hidden=true;}
function filterPal(q){q=q.toLowerCase();palItems=ACTIONS.filter(a=>a.k.toLowerCase().includes(q));palSel=0;paintPal();}
function paintPal(){
  const list=$("palList");list.textContent="";
  palItems.forEach((a,i)=>{const it=el("div","pal-item"+(i===palSel?" sel":""),a.k);it.onclick=()=>{closePalette();a.run();};list.appendChild(it);});
}

/* ---------- files, import, wiring ---------- */
function importWorkspace(file){
  file.text().then(t=>{
    const s=JSON.parse(t);
    if(!Array.isArray(s.projects))throw new Error("not a ZTC workspace file");
    state=normalize(s);refreshRoutes();saveNow();renderAll();toast("Workspace imported");
  }).catch(e=>toast("Import failed: "+e.message));
}
async function generateTextFiles(list){
  if(runtime.pending.length+list.length>LIMITS.maxFiles){toast("Up to "+LIMITS.maxFiles+" files per message");return;}
  for(const f of list){
    if(!TEXT_FILE.test(f.name)&&!(f.type||"").startsWith("text/")){toast("Skipped "+f.name+": text and code files only");continue;}
    if(f.size>LIMITS.maxFileBytes){toast("Skipped "+f.name+": over 600 KB");continue;}
    runtime.pending.push({name:sanitizeText(f.name,120),text:sanitizeText(await f.text(),150000)});
  }
  renderFiles();
}
$("sendBtn").onclick=sendFromInput;
$("stopBtn").onclick=()=>{if(runtime.ctl)runtime.ctl.abort();};
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendFromInput();}});
$("input").addEventListener("input",autosize);
$("attachBtn").onclick=()=>$("file").click();
$("file").onchange=e=>{generateTextFiles([...e.target.files]);e.target.value="";};
$("importFile").onchange=e=>{if(e.target.files[0])importWorkspace(e.target.files[0]);e.target.value="";};
$("newProject").onclick=()=>{
  const name=prompt("Project name","Project "+(state.projects.length+1));if(!name)return;
  const p=newProject(name.trim());p.chats.push(newChat());state.projects.push(p);
  state.activeProject=p.id;state.activeChat=p.chats[0].id;saveSoon();renderAll();
};
$("newChat").onclick=()=>{
  if(runtime.busy)return;
  const p=activeProject();if(!p)return;
  const c=newChat();p.chats.unshift(c);state.activeChat=c.id;saveSoon();renderAll();
};
$("filter").oninput=()=>renderSidebar();
$("openRoutes").onclick=openRoutes;
$("menuBtn").onclick=()=>$("side").classList.toggle("open");
$("openSettings").onclick=openSettings;
$("palBtn").onclick=openPalette;
$("modes").addEventListener("click",e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.mode);});
$("speed").onchange=e=>{state.speed=e.target.value;saveSoon();};
$("togSearch").onchange=e=>{state.search=e.target.checked;saveSoon();};
$("togVerify").onchange=e=>{state.verify=e.target.checked;saveSoon();};
$("overlay").addEventListener("mousedown",e=>{if(e.target.id==="overlay")closeModal();});
$("palette").addEventListener("mousedown",e=>{if(e.target.id==="palette")closePalette();});
$("palInput").oninput=e=>filterPal(e.target.value);
$("palInput").onkeydown=e=>{
  if(e.key==="ArrowDown"){palSel=Math.min(palSel+1,palItems.length-1);paintPal();e.preventDefault();}
  else if(e.key==="ArrowUp"){palSel=Math.max(palSel-1,0);paintPal();e.preventDefault();}
  else if(e.key==="Enter"){const a=palItems[palSel];closePalette();if(a)a.run();}
  else if(e.key==="Escape")closePalette();
};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPalette();}
  else if(e.key==="Escape"){if(!$("palette").hidden)closePalette();else if(!$("overlay").hidden)closeModal();}
});

buildDropdown($("speed"));
try{if((navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=4)||(navigator.connection&&navigator.connection.saveData)||window.matchMedia("(prefers-reduced-motion: reduce)").matches)document.documentElement.classList.add("low-power");}catch(e){}
window.addEventListener("online",()=>{if(!runtime.busy)setStatus("Online · ready","ok");});
window.addEventListener("offline",()=>{if(!runtime.busy)setStatus("Offline · cloud APIs unavailable","bad");});
refreshRoutes();
renderAll();
renderFiles();
setStatus("Ready","");
autosize();
document.addEventListener("keydown",e=>{
  if(e.altKey&&/^[1-4]$/.test(e.key)){e.preventDefault();setMode(["auto","agents","council","single"][Number(e.key)-1]);}
});
</script>
</body>
</html>
